# Statische Karte hinter dem Cloudflare Tunnel (usc-wp-map.skela.cc → http://usc-wp-map:3000).
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Für Healthcheck und Watchdog (AGENTS.md)
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Seiten wie /checkin kennt nur die App: alles Unbekannte bekommt index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Service Worker und Einstieg nie zwischenspeichern, sonst kommen Updates nicht an
  location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Daten ändern sich mit jedem Build (Abfrage mit ?t=…): nicht zwischenspeichern
  location /data/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Dateien mit Hash im Namen dürfen lange liegen
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
